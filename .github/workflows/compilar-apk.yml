name: Compilar APK de stickers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          set -e
          unzip -o -q proyecto-stickers.zip -d .
          echo "Proyecto descomprimido."

      - name: Aplicar Ashley Stickers Studio
        run: |
          set -e
          cp -R overlay/app/src/main/. app/src/main/
          echo "Studio aplicado."

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 36 y build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Crear local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RST-Creative-Stickers.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RST Creative Stickers 1.0.${{ github.run_number }}
          body: "Ashley Stickers: editor local con importar imagen, eliminar fondo simple, borde blanco, animación de vista previa, guardar, compartir y acceso a los packs de WhatsApp."
          files: RST-Creative-Stickers.apk
