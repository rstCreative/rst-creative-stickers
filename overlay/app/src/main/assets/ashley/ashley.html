<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ashley Stickers</title>
<style>
:root{--bg:#141428;--card:#1b1e33;--muted:#9da2b8;--pink:#ff2d8e;--purple:#7435f3;--blue:#139de8;--green:#12c978}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#080a12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.phone{width:100%;height:100%;max-width:430px;margin:auto;background:linear-gradient(145deg,#101326,#141428 60%,#0d1020);position:relative;overflow:hidden}
.status{height:34px;padding:8px 18px 0;display:flex;justify-content:space-between;font-weight:750;font-size:14px}.icons{display:flex;gap:8px}
.screen{position:absolute;inset:34px 0 0;padding:0 15px 84px;overflow:auto;opacity:0;visibility:hidden;transform:translateX(24px);transition:.32s;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.screen.on{opacity:1;visibility:visible;transform:none}
.head{height:68px;display:flex;align-items:center;gap:10px}.head h2{font-size:19px;text-align:center;flex:1;margin:0}.icon{width:42px;height:42px;border:0;border-radius:14px;background:#22263b;color:#fff;font-size:23px;display:grid;place-items:center}.save,.export{height:44px;border:0;border-radius:14px;padding:0 17px;background:linear-gradient(100deg,#ff2d8e,#f82b9b);color:#fff;font-weight:850}
.logo{margin-top:4px;line-height:.82}.logo b{font-size:44px;letter-spacing:-3px;background:linear-gradient(135deg,#fff,#ff54aa,#7450ff);-webkit-background-clip:text;color:transparent}.logo small{display:block;margin-left:28px;margin-top:7px;color:#ff55ad;letter-spacing:4px;font-weight:900;font-size:11px}.gear{float:right;margin-top:-48px}
.hero{height:244px;margin-top:16px;border-radius:21px;overflow:hidden;position:relative;background:radial-gradient(circle at 10% 80%,#316cffaa,transparent 42%),linear-gradient(135deg,#29216d,#5a209d 48%,#182b69)}.heroText{position:absolute;left:18px;top:42px;width:55%;z-index:2}.heroText b{font-size:27px;line-height:1.02;display:block}.heroText span{display:block;margin-top:13px;font-size:14px;line-height:1.3;font-weight:650}.hero img{position:absolute;right:-3%;bottom:-8%;width:55%;height:108%;object-fit:contain;z-index:1;filter:drop-shadow(-8px 12px 10px #0005)}.heart{position:absolute;right:37%;top:27px;width:48px;height:48px;border-radius:50%;background:#fff;color:#f32d91;display:grid;place-items:center;font-size:25px;z-index:3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.action{min-height:116px;border:0;border-radius:18px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 9px 20px #0003}.pink{background:linear-gradient(145deg,#ff2290,#ec2381)}.blue{background:linear-gradient(145deg,#11a6ee,#087ed0)}.purple{background:linear-gradient(145deg,#8937ff,#6331d9)}.green{background:linear-gradient(145deg,#16ce8b,#08a968)}.action .ico{font-size:28px}.action b{font-size:16px}.action small{font-size:11px;margin-top:2px}.section{display:flex;justify-content:space-between;align-items:center;margin:17px 4px 9px}.section h3{margin:0;font-size:19px}.section button{background:none;border:0;color:#aeb3c8}.thumbs{display:flex;gap:10px}.thumb{flex:1;aspect-ratio:1;border-radius:15px;background:#202337;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}
.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#0e111ff5;backdrop-filter:blur(15px);border-top:1px solid #ffffff0d;display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;z-index:20}.nav button{border:0;background:none;color:#858ba2;font-size:10px;font-weight:700}.nav button.active{color:#ff38a0}.plus{width:57px;height:57px;margin:auto;margin-top:-16px;border-radius:20px!important;background:linear-gradient(145deg,#ff4cab,#ef1d82)!important;color:#fff!important;font-size:32px!important;box-shadow:0 9px 25px #ff2d8e66}.nav span{display:block;font-size:22px;margin-bottom:2px}
.preview{height:300px;border-radius:20px;display:grid;place-items:center;overflow:hidden;background:repeating-conic-gradient(#d0d0d0 0 25%,#eee 0 50%) 0/28px 28px}.preview img,.anim img,.done img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 0 #fff) drop-shadow(0 8px 15px #0004)}
.tabs{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:7px;margin-top:15px}.tab,.tool,.opt{border:1px solid transparent;background:#171b2d;color:#9298ad;border-radius:15px;font-weight:700}.tab{height:67px;font-size:10px}.tab.on,.opt.on{border-color:#ff36a0;color:#fff;background:#242039}.control{display:flex;justify-content:space-between;margin:17px 4px 8px;font-size:14px}.range{width:100%;accent-color:#ff2d8e}.colors{display:flex;justify-content:space-between;margin-top:8px}.color{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.color.on{box-shadow:0 0 0 2px #ff2d8e;border-color:#fff;transform:scale(1.1)}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:18px}.tool{height:60px;font-size:9px}.tool span{display:block;font-size:20px;margin-bottom:3px}
.anim{height:300px;border-radius:20px;display:grid;place-items:center;background:radial-gradient(circle,#30344b,#171b2c)}.anim.play img{animation:b .55s infinite alternate ease-in-out}@keyframes b{to{transform:translateY(-7px) scale(1.025) rotate(-1deg)}}.player{display:flex;align-items:center;gap:11px;margin:14px 3px}.play{width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#111;font-size:18px}.bar{height:5px;flex:1;background:#34374a;border-radius:5px;overflow:hidden}.fill{height:100%;width:0;background:#ff2d8e}.time{font-size:12px}.frames{display:flex;gap:7px}.frame{flex:1;aspect-ratio:1;background:#171b2d;border:2px solid transparent;border-radius:12px;overflow:hidden}.frame:first-child{border-color:#ff2d8e}.frame img{width:100%;height:100%;object-fit:contain}.label{font-size:15px;font-weight:800;margin:16px 4px 8px}.opts{display:flex;gap:7px;overflow:auto}.opt{height:45px;min-width:58px;padding:0 11px}.bgopt{height:63px;min-width:70px;font-size:10px}.bgbox{display:block;width:28px;height:28px;border-radius:6px;margin:4px auto;background:#fff}.checker{background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0/8px 8px}.blackbox{background:#000}.greenbox{background:#10c873}
.done{height:300px;border-radius:20px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 25% 25%,#ffffff22 0 2px,transparent 3px),radial-gradient(circle at 75% 70%,#ffffff22 0 2px,transparent 3px),#181b2d}.done img{height:88%}.check{position:absolute;bottom:18px;width:68px;height:68px;border-radius:50%;background:#17d477;border:5px solid #111526;display:grid;place-items:center;font-size:36px;animation:pop .6s}.doneTitle{text-align:center;font-size:22px;font-weight:900;margin-top:22px}.sub{text-align:center;color:#a4a9bd;font-size:14px;margin:4px 0 16px}.big{width:100%;height:53px;border:0;border-radius:15px;color:#fff;font-weight:850;font-size:15px;margin-top:9px}.dl{background:linear-gradient(100deg,#7136e9,#7c30f7)}.share{background:linear-gradient(100deg,#12c878,#09ae68)}.socials{display:flex;justify-content:space-between;margin:17px 6px}.social{border:0;background:none;color:#b4b8c8;font-size:9px}.social i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#202438;font-style:normal;font-size:18px;margin:auto auto 5px}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary button{height:47px;border:1px solid #ffffff12;border-radius:14px;background:#1b1f32;color:#fff;font-weight:750}.secondary button:last-child{color:#ff62ad;border-color:#ff2d8e66}
.toast{position:absolute;bottom:88px;left:50%;transform:translate(-50%,20px);opacity:0;background:#292d42;padding:11px 16px;border-radius:13px;font-size:12px;font-weight:700;transition:.25s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div class="phone">
<section id="home" class="screen on"><div class="status"><b>10:24</b><span class="icons">◔　▮▮　▣</span></div>
<div class="logo"><b>♛ Ashley</b><small>STICKERS</small><button class="icon gear" onclick="toast('Ajustes')">⚙</button></div>
<div class="hero"><div class="heroText"><b>Crea<br>Stickers<br>Increíbles</b><span>Con IA, edita, anima y comparte</span></div><div class="heart">♥</div><img src="file:///android_asset/rst_creative_1/02_corazon.webp"></div>
<div class="grid">
<button class="action pink" onclick="go('editor')"><span class="ico">✎</span><b>Crear Sticker</b><small>Desde imagen o IA</small></button>
<button class="action blue" onclick="go('editor')"><span class="ico">✣</span><b>Eliminar Fondo</b><small>con IA</small></button>
<button class="action purple" onclick="go('animated')"><span class="ico">▣</span><b>Sticker Animado</b><small>GIF o Video</small></button>
<button class="action green" onclick="toast('Generador IA listo')"><span class="ico">✦</span><b>Generar con IA</b><small>Texto a imagen</small></button>
</div>
<div class="section"><h3>Mis Stickers</h3><button onclick="toast('Galería')">Ver todos</button></div>
<div class="thumbs"><div class="thumb"><img src="file:///android_asset/rst_creative_1/01_brazos_salto.webp"></div><div class="thumb"><img src="file:///android_asset/rst_creative_1/02_corazon.webp"></div><div class="thumb"><img src="file:///android_asset/rst_creative_1/03_salto_corazon.webp"></div></div>
</section>

<section id="editor" class="screen"><div class="status"><b>10:24</b><span>◔　▮▮　▣</span></div>
<div class="head"><button class="icon" onclick="go('home')">‹</button><h2>Editar Sticker</h2><button class="save" onclick="go('animated')">Guardar</button></div>
<div class="preview"><img src="file:///android_asset/rst_creative_1/02_corazon.webp"></div>
<div class="tabs"><button class="tab on" onclick="tab(this)">Eliminar Fondo</button><button class="tab" onclick="tab(this)">Recortar</button><button class="tab" onclick="tab(this)">Texto</button><button class="tab" onclick="tab(this)">Borde</button></div>
<div class="control"><b>Tamaño del Borde</b><span id="bv">12 px</span></div><input class="range" type="range" min="0" max="30" value="12" oninput="bv.textContent=this.value+' px'">
<div class="control" style="margin-top:14px"><b>Color</b></div>
<div class="colors"><button class="color on" style="background:#fff" onclick="color(this)"></button><button class="color" style="background:#000" onclick="color(this)"></button><button class="color" style="background:#f42b91" onclick="color(this)"></button><button class="color" style="background:#197bea" onclick="color(this)"></button><button class="color" style="background:#7b35ee" onclick="color(this)"></button><button class="color" style="background:#12c978" onclick="color(this)"></button><button class="color" style="background:#ffae19" onclick="color(this)"></button><button class="color" style="background:conic-gradient(#f23,#ff0,#1c7,#19e,#73f,#f23)" onclick="color(this)"></button></div>
<div class="tools"><button class="tool" onclick="toast('Filtros')">◉<br>Filtros</button><button class="tool" onclick="toast('Ajustar')">☷<br>Ajustar</button><button class="tool" onclick="toast('Stickers')">♧<br>Stickers</button><button class="tool" onclick="toast('Emoji')">☺<br>Emoji</button><button class="tool" onclick="toast('Dibujar')">✎<br>Dibujar</button></div>
</section>

<section id="animated" class="screen"><div class="status"><b>10:24</b><span>◔　▮▮　▣</span></div>
<div class="head"><button class="icon" onclick="go('editor')">‹</button><h2>Sticker Animado</h2><button class="export" onclick="go('done')">Exportar</button></div>
<div id="anim" class="anim"><img src="file:///android_asset/rst_creative_1/02_corazon.webp"></div>
<div class="player"><button class="play" onclick="play()">▶</button><div class="bar"><div id="fill" class="fill"></div></div><span id="tm" class="time">0:00 / 0:02</span></div>
<div class="frames"><div class="frame"><img src="file:///android_asset/rst_creative_1/01_brazos_salto.webp"></div><div class="frame"><img src="file:///android_asset/rst_creative_1/02_corazon.webp"></div><div class="frame"><img src="file:///android_asset/rst_creative_1/03_salto_corazon.webp"></div><div class="frame"><img src="file:///android_asset/rst_creative_1/02_corazon.webp"></div><div class="frame"><img src="file:///android_asset/rst_creative_1/01_brazos_salto.webp"></div></div>
<div class="label">Velocidad</div><div class="opts"><button class="opt" onclick="opt(this)">0.5x</button><button class="opt on" onclick="opt(this)">1x</button><button class="opt" onclick="opt(this)">1.5x</button><button class="opt" onclick="opt(this)">2x</button></div>
<div class="label">Fondo</div><div class="opts"><button class="opt bgopt on" onclick="opt(this)"><span class="bgbox checker"></span>Transparente</button><button class="opt bgopt" onclick="opt(this)"><span class="bgbox greenbox"></span>Verde</button><button class="opt bgopt" onclick="opt(this)"><span class="bgbox"></span>Blanco</button><button class="opt bgopt" onclick="opt(this)"><span class="bgbox blackbox"></span>Negro</button></div>
<div class="label">Formato</div><div class="opts"><button class="opt on" onclick="opt(this)">GIF</button><button class="opt" onclick="opt(this)">MP4</button><button class="opt" onclick="opt(this)">WebP</button><button class="opt" onclick="opt(this)">APNG</button></div>
</section>

<section id="done" class="screen"><div class="status"><b>10:24</b><span>◔　▮▮　▣</span></div>
<div class="head"><button class="icon" onclick="go('animated')">‹</button><h2>¡Listo!</h2><button class="icon" onclick="go('home')">⌂</button></div>
<div class="done"><span style="position:absolute;left:15%;top:18%;font-size:25px">✦</span><span style="position:absolute;right:15%;top:28%;font-size:18px">✧</span><img src="file:///android_asset/rst_creative_1/02_corazon.webp"><div class="check">✓</div></div>
<div class="doneTitle">Sticker creado</div><div class="sub">¿Qué quieres hacer ahora?</div>
<button class="big dl" onclick="nativeAction('guardar')">⇩　Guardar en Galeria</button><button class="big share" onclick="nativeAction('compartir')">⌯　Compartir</button>
<div class="socials"><button class="social" onclick="nativeAction('WhatsApp')"><i>☘</i>WhatsApp</button><button class="social" onclick="nativeAction('Telegram')"><i>➤</i>Telegram</button><button class="social" onclick="nativeAction('Instagram')"><i>◎</i>Instagram</button><button class="social" onclick="nativeAction('TikTok')"><i>♪</i>TikTok</button><button class="social" onclick="nativeAction('Más')"><i>•••</i>Más</button></div>
<div class="secondary"><button onclick="go('home')">↻　Crear Otro</button><button onclick="go('home')">♜　Limpiar Todo</button></div>
</section>

<nav class="nav"><button class="active" onclick="go('home')"><span>⌂</span>Inicio</button><button onclick="toast('Galería')"><span>▧</span>Galería</button><button class="plus" onclick="go('editor')">+</button><button onclick="toast('Plantillas')"><span>▤</span>Plantillas</button><button onclick="toast('Perfil')"><span>♙</span>Perfil</button></nav>
<div id="toast" class="toast"></div>
</div>
<script>
const ids=['home','editor','animated','done'];let timer;
function go(id){ids.forEach(x=>document.getElementById(x).classList.toggle('on',x===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(id==='home')document.querySelector('.nav button').classList.add('active')}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800)}
function tab(b){b.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');toast(b.textContent)}
function color(b){b.parentElement.querySelectorAll('.color').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function opt(b){b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');toast(b.textContent)}
let playing=false,start;
function play(){const a=document.getElementById('anim'),f=document.getElementById('fill'),tm=document.getElementById('tm');playing=!playing;a.classList.toggle('play',playing);if(!playing)return;if(start)cancelAnimationFrame(start);const t0=performance.now();function step(t){let p=Math.min(1,(t-t0)/2000);f.style.width=p*100+'%';tm.textContent='0:0'+Math.floor(p*2)+' / 0:02';if(p<1&&playing)start=requestAnimationFrame(step);else{playing=false;a.classList.remove('play')}}start=requestAnimationFrame(step)}
function nativeAction(x){if(window.Android&&Android.action)Android.action(x);else toast(x)}
</script></body></html>
